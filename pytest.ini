[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: быстрые smoke-тесты основных сценариев
    login: тесты авторизации
    search: тесты поиска туров и отелей
    auth_required: тесты, требующие валидных учётных данных в .env
